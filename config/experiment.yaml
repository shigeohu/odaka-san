# MAXONE experiment configuration
schema_version: 2

experiment:
  experiment_id: "REPLACE_WITH_EXPERIMENT_ID"
  mode: dry_run  # simulate | dry_run | armed
  timezone: "Asia/Tokyo"

paths:
  # Absolute path where MaxLab Live exports metrics workbooks
  # (metrics_data_<YYYYMMDD>_<HHMMSS>.xlsx).
  metrics_watch_directory: null
  accepted_archive_directory: "./runtime/archive"
  quarantine_directory: "./runtime/quarantine"
  state_directory: "./runtime/state"
  log_directory: "./runtime/logs"

metrics_watcher:
  filename_glob: "metrics_data_*.xlsx"

  # MaxLab Live saves an export into "a folder labeled with the date and time at
  # which the export was carried out" (Manual v25.1 section 8.3.4), so the
  # workbook appears one level down rather than directly in the watch
  # directory. Search the tree, not just the top level.
  recursive: true
  poll_interval_seconds: 5
  stable_for_seconds: 15
  # This waits on an operator running Analysis + Export in the MaxLab Live GUI
  # (CLAUDE.md section 3), not on the instrument. Exporting all metrics from an
  # active culture can itself take several minutes, so set this to the realistic
  # human turnaround, not the analysis runtime.
  metrics_timeout_minutes: 10
  hash_algorithm: sha256

  # Excel lock/temporary artefacts must never be treated as input.
  ignore_filename_prefixes: ["~$", ".", "_"]

  # A workbook may be re-exported with recordings appended, so the workbook
  # hash alone is not a sufficient idempotency key. Deduplication is on the
  # recording identity (Meta Data.Folder Path). See CLAUDE.md section 8.1.
  deduplicate_on: recording_identity
  reject_already_consumed_recording: true
  allow_repeated_workbook_hash: true

  # The filename timestamp is the export time, not a recording time.
  # Staleness is judged from the selected recording's Start/Stop Time.
  staleness_source: recording_start_stop_time
  reject_recordings_older_than_cycle_start: true

adaptive_policy:
  # Cycle 0 records baseline without transmitting a stimulation sequence.
  baseline_amplitude_mV: 0.0

  # REQUIRED before armed mode:
  reference_threshold_hz: null
  amplitude_step_mV: null
  maximum_amplitude_mV: null

  threshold_comparison: greater_than_or_equal
  action_at_or_above_threshold: complete
  action_when_next_step_exceeds_maximum: complete
  maximum_cycles: null
  minimum_cooldown_seconds: 120
  maximum_total_experiment_minutes: null

quality_control:
  # Workbook-level and recording-level QC thresholds live in
  # config/metrics_schema.yaml, which owns the file format.
  # These are the run-level gates.
  fail_on_ambiguous_recording_selection: true
  fail_on_missing_recording: true
  fail_on_unknown_units: true
  fail_on_qc_flag: true

runtime:
  require_hardware_environment_gate: true
  hardware_environment_variable: "MAXONE_HARDWARE_ENABLED"
  hardware_environment_required_value: "1"
  require_exclusive_device_lock: true
  resume_after_restart: false
  structured_log_format: jsonl
  ledger_backend: sqlite

required_before_armed:
  - paths.metrics_watch_directory
  - adaptive_policy.reference_threshold_hz
  - adaptive_policy.amplitude_step_mV
  - adaptive_policy.maximum_amplitude_mV
  - adaptive_policy.maximum_cycles
  - adaptive_policy.maximum_total_experiment_minutes
  - metrics_schema.recording_selection.strategy
  - metrics_schema.expected_acquisition.duration_seconds_min
  - metrics_schema.expected_acquisition.duration_seconds_max
  - metrics_schema.quality_control.minimum_active_area_percent
  - metrics_schema.quality_control.minimum_active_electrodes
  - metrics_schema.quality_control.active_area_denominator_electrodes
  - stimulation.protocol_id
  - stimulation.stimulation_electrodes
  - stimulation.waveform.phase_duration_samples
  - stimulation.waveform.pulses_per_train
  - stimulation.waveform.inter_pulse_interval_samples
  - stimulation.hard_limits.maximum_absolute_amplitude_mV
  - stimulation.hard_limits.maximum_cumulative_stimulations
  - hardware.maxlab_live_version
  - hardware.api_version
  - hardware.emergency_stop_procedure
